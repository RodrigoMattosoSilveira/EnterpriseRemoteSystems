name: 1Password vault access smoke test

# Manual, read-only connectivity check; does NOT deploy or materialize secrets.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to validate
        required: true
        type: choice
        options:
          - development
          - test
          - production

permissions:
  contents: read

jobs:
  service-account-check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Confirm expected vault access without printing values
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]]; then
            echo 'Missing environment-scoped OP_SERVICE_ACCOUNT_TOKEN' >&2
            exit 1
          fi
          case "$TARGET_ENV" in
            development) EXPECTED_VAULT=ers-development ;;
            test) EXPECTED_VAULT=ers-test ;;
            production) EXPECTED_VAULT=ers-production ;;
            *) exit 1 ;;
          esac
          op vault get "$EXPECTED_VAULT" >/dev/null
          op vault get ers-deployment >/dev/null
          # A forbidden vault must be unreadable. Deliberately hide errors.
          for forbidden in ers-recovery ers-automation-bootstrap; do
            if op vault get "$forbidden" >/dev/null 2>&1; then
              echo "Forbidden vault unexpectedly accessible: $forbidden" >&2
              exit 1
            fi
          done
          echo "Service Account vault smoke test passed for $TARGET_ENV"

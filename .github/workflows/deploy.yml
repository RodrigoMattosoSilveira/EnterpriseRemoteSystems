name: Deploy Enterprise Remote Systems

run-name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}

on:
  push:
    branches:
      - development
      - test
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - development
          - test
          - production

      deploy_edge:
        description: "Also sync/reload the edge proxy from this branch"
        required: false
        default: false
        type: boolean

      run_deployed_playwright:
        description: "Run Playwright against deployed environment. Ignored for production."
        required: false
        default: true
        type: boolean

      test_release_rehearsal:
        description: "For Test only: restore the known pre-release baseline before deployment and record a rehearsal gate after full verification."
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: |
          go mod download
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run check

  deploy:
    name: Deploy environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - quality-gate

    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}

    env:
      SERVER_ROOT: /opt/EnterpriseRemoteSystems
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      CONFIGURED_E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    outputs:
      env_name: ${{ steps.target.outputs.env_name }}
      branch: ${{ steps.target.outputs.branch }}
      domain: ${{ steps.target.outputs.domain }}
      env_dir: ${{ steps.target.outputs.env_dir }}
      make_prefix: ${{ steps.target.outputs.make_prefix }}
      run_playwright_post_deploy: ${{ steps.target.outputs.run_playwright_post_deploy }}
      revision: ${{ steps.revision.outputs.sha }}
      tree_sha: ${{ steps.revision.outputs.tree_sha }}
      e2e_admin_email: ${{ steps.e2e_admin.outputs.email }}
      database_strategy: ${{ steps.target.outputs.database_strategy }}
      test_release_rehearsal: ${{ steps.target.outputs.test_release_rehearsal }}

    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.environment }}"
            MANUAL_EDGE="${{ inputs.deploy_edge }}"
            MANUAL_PLAYWRIGHT="${{ inputs.run_deployed_playwright }}"
            TEST_RELEASE_REHEARSAL="${{ inputs.test_release_rehearsal }}"
          else
            TARGET_ENV="${GITHUB_REF_NAME}"
            MANUAL_EDGE="false"
            MANUAL_PLAYWRIGHT="true"
            # A branch promotion into Test is itself the release rehearsal.
            # Manual workflow_dispatch remains available for an explicit ordinary
            # Test redeploy with test_release_rehearsal=false.
            if [[ "$TARGET_ENV" == "test" ]]; then
              TEST_RELEASE_REHEARSAL="true"
            else
              TEST_RELEASE_REHEARSAL="false"
            fi
          fi

          if [[ "$TEST_RELEASE_REHEARSAL" == "true" && "$TARGET_ENV" != "test" ]]; then
            echo "Test release rehearsal may only be requested for the Test environment."
            exit 1
          fi

          case "$TARGET_ENV" in
            development)
              echo "env_name=development" >> "$GITHUB_OUTPUT"
              echo "branch=development" >> "$GITHUB_OUTPUT"
              echo "env_dir=${SERVER_ROOT}/development" >> "$GITHUB_OUTPUT"
              echo "make_prefix=server-dev" >> "$GITHUB_OUTPUT"
              echo "domain=dev.enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"
              echo "deploy_edge=${MANUAL_EDGE}" >> "$GITHUB_OUTPUT"
              echo "run_playwright_post_deploy=${MANUAL_PLAYWRIGHT}" >> "$GITHUB_OUTPUT"
              echo "default_e2e_admin_email=e2e-admin-dev@enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"
              echo "e2e_admin_display_name=Development E2E Administrator" >> "$GITHUB_OUTPUT"
              echo "database_strategy=replace-fresh" >> "$GITHUB_OUTPUT"
              echo "test_release_rehearsal=false" >> "$GITHUB_OUTPUT"
              ;;

            test)
              echo "env_name=test" >> "$GITHUB_OUTPUT"
              echo "branch=test" >> "$GITHUB_OUTPUT"
              echo "env_dir=${SERVER_ROOT}/test" >> "$GITHUB_OUTPUT"
              echo "make_prefix=server-test" >> "$GITHUB_OUTPUT"
              echo "domain=tst.enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"
              echo "deploy_edge=${MANUAL_EDGE}" >> "$GITHUB_OUTPUT"
              echo "run_playwright_post_deploy=${MANUAL_PLAYWRIGHT}" >> "$GITHUB_OUTPUT"
              echo "default_e2e_admin_email=e2e-admin-tst@enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"
              echo "e2e_admin_display_name=Test E2E Administrator" >> "$GITHUB_OUTPUT"
              echo "database_strategy=migrate-in-place" >> "$GITHUB_OUTPUT"
              if [[ "$TEST_RELEASE_REHEARSAL" == "true" ]]; then
                if [[ "$MANUAL_PLAYWRIGHT" != "true" ]]; then
                  echo "Test release rehearsal requires deployed Playwright verification."
                  exit 1
                fi
                echo "database_strategy=restore-baseline+migrate-in-place" >> "$GITHUB_OUTPUT"
                echo "test_release_rehearsal=true" >> "$GITHUB_OUTPUT"
              else
                echo "test_release_rehearsal=false" >> "$GITHUB_OUTPUT"
              fi
              ;;

            production)
              echo "env_name=production" >> "$GITHUB_OUTPUT"
              echo "branch=production" >> "$GITHUB_OUTPUT"
              echo "env_dir=${SERVER_ROOT}/production" >> "$GITHUB_OUTPUT"
              echo "make_prefix=server-prod" >> "$GITHUB_OUTPUT"
              echo "domain=app.enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"

              # Production is the canonical branch for edge deployment.
              echo "deploy_edge=true" >> "$GITHUB_OUTPUT"

              # Do not run deployed Playwright against production.
              echo "run_playwright_post_deploy=false" >> "$GITHUB_OUTPUT"
              echo "default_e2e_admin_email=e2e-admin@enterpriseremotesystems.com" >> "$GITHUB_OUTPUT"
              echo "e2e_admin_display_name=Production Automation Administrator" >> "$GITHUB_OUTPUT"
              echo "database_strategy=migrate-in-place" >> "$GITHUB_OUTPUT"
              echo "test_release_rehearsal=false" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported target environment: $TARGET_ENV"
              exit 1
              ;;
          esac

      - name: Resolve administrator provisioning configuration
        id: e2e_admin
        shell: bash
        run: |
          set -euo pipefail

          email="${CONFIGURED_E2E_ADMIN_EMAIL:-${{ steps.target.outputs.default_e2e_admin_email }}}"
          password="${E2E_ADMIN_PASSWORD:-}"

          if [[ -z "$email" ]]; then
            echo "::error title=Missing administrator login::Unable to resolve the E2E administrator email for '${{ steps.target.outputs.env_name }}'."
            exit 1
          fi
          if [[ -z "$password" ]]; then
            echo "::error title=Missing administrator provisioning secret::Configure E2E_ADMIN_PASSWORD in the '${{ steps.target.outputs.env_name }}' GitHub environment. The provisioning operation creates or resets the account, so no pre-existing password is required."
            exit 1
          fi
          if [[ "$email" == *$'\n'* || "$email" == *$'\r'* || "$password" == *$'\n'* || "$password" == *$'\r'* ]]; then
            echo "::error title=Invalid administrator provisioning value::Administrator email and password must not contain newline characters."
            exit 1
          fi
          if [[ "$password" == "change-this-password-immediately" ]]; then
            echo "::error title=Placeholder administrator password::Replace the placeholder with a unique E2E_ADMIN_PASSWORD secret in the '${{ steps.target.outputs.env_name }}' GitHub environment."
            exit 1
          fi
          password_characters="$(python3 -c 'import os; print(len(os.environ["E2E_ADMIN_PASSWORD"]))')"
          password_bytes="$(printf '%s' "$password" | wc -c | tr -d '[:space:]')"
          if (( password_characters < 12 || password_bytes > 72 )); then
            echo "::error title=Invalid administrator password length::E2E_ADMIN_PASSWORD must contain at least 12 characters and no more than 72 UTF-8 bytes."
            exit 1
          fi

          echo "::add-mask::$password"
          echo "email=$email" >> "$GITHUB_OUTPUT"
          echo "Administrator provisioning configuration resolved for ${{ steps.target.outputs.env_name }}"

      - name: Checkout deployment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Resolve immutable deployment revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable revision ${SHA} (tree ${TREE_SHA})"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/known_hosts <<'EOF'
          ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EOF

          chmod 644 ~/.ssh/known_hosts

      - name: Preflight server checks
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             test -d '${{ steps.target.outputs.env_dir }}'
             test -f '${{ steps.target.outputs.env_dir }}/Makefile'
             test -f '${{ steps.target.outputs.env_dir }}/docker-compose.server.yml'
             test -f '${{ steps.target.outputs.env_dir }}/deploy/Caddyfile'
             test -f '${{ steps.target.outputs.env_dir }}/scripts/init-server-env.sh'
             echo 'Preflight checks passed for ${{ steps.target.outputs.env_name }}'
            "

      - name: Deploy app stack
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail

             cd '${{ steps.target.outputs.env_dir }}'

             echo 'Deploying ${{ steps.target.outputs.env_name }} from branch ${{ steps.target.outputs.branch }}'
             echo 'Pinned revision: ${{ steps.revision.outputs.sha }}'

             git fetch origin '${{ steps.target.outputs.branch }}'
             git cat-file -e '${{ steps.revision.outputs.sha }}^{commit}'
             git checkout -B '${{ steps.target.outputs.branch }}' '${{ steps.revision.outputs.sha }}'

             test "$(git rev-parse HEAD)" = '${{ steps.revision.outputs.sha }}'
             test "$(git rev-parse HEAD^{tree})" = '${{ steps.revision.outputs.tree_sha }}'

             if [[ '${{ steps.target.outputs.env_name }}' == 'production' ]]; then
               make server-require-test-release-rehearsal \
                 ENV=production \
                 TREE_SHA='${{ steps.revision.outputs.tree_sha }}'
             fi

             make ${{ steps.target.outputs.make_prefix }}-build

             case '${{ steps.target.outputs.database_strategy }}' in
               replace-fresh)
                 echo 'Replacing disposable Development database from the current migration chain.'
                 make server-replace-development-db ENV=development
                 ;;
               restore-baseline+migrate-in-place)
                 echo 'Restoring the known pre-release Test baseline; backend startup will migrate it in place.'
                 make server-test-rehearsal-restore ENV=test
                 ;;
               migrate-in-place)
                 echo 'Preserving ${{ steps.target.outputs.env_name }} database; migrations will run in place during backend startup.'
                 ;;
               *)
                 echo 'Unsupported database strategy: ${{ steps.target.outputs.database_strategy }}'
                 exit 1
                 ;;
             esac

             if ! make ${{ steps.target.outputs.make_prefix }}-up; then
               echo 'Application stack failed to become healthy; collecting server diagnostics.'
               make server-diagnostics ENV='${{ steps.target.outputs.env_name }}' || true
               exit 1
             fi
             if ! make ${{ steps.target.outputs.make_prefix }}-backend-health; then
               echo 'Backend health verification failed; collecting server diagnostics.'
               make server-diagnostics ENV='${{ steps.target.outputs.env_name }}' || true
               exit 1
             fi
             make ${{ steps.target.outputs.make_prefix }}-env-caddy-health
            "

      - name: Provision application administrator
        shell: bash
        env:
          RESOLVED_E2E_ADMIN_EMAIL: ${{ steps.e2e_admin.outputs.email }}
          E2E_ADMIN_DISPLAY_NAME: ${{ steps.target.outputs.e2e_admin_display_name }}
        run: |
          set -euo pipefail

          payload="$(jq -cn \
            --arg actorKey "e2e-application-admin" \
            --arg displayName "$E2E_ADMIN_DISPLAY_NAME" \
            --arg login "$RESOLVED_E2E_ADMIN_EMAIL" \
            --arg password "$E2E_ADMIN_PASSWORD" \
            '{actorKey: $actorKey, displayName: $displayName, login: $login, password: $password}')"

          printf '%s' "$payload" | ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd '${{ steps.target.outputs.env_dir }}'
             make server-provision-e2e-admin ENV='${{ steps.target.outputs.env_name }}'
            "

      - name: Deploy edge proxy when required
        if: ${{ steps.target.outputs.deploy_edge == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail

             cd '${{ steps.target.outputs.env_dir }}'

             echo 'Deploying edge proxy from ${{ steps.target.outputs.branch }} branch'

             make edge-sync
             make edge-up
             make edge-reload
            "

      - name: Public smoke tests
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail

             cd '${{ steps.target.outputs.env_dir }}'

             echo 'Running public smoke tests for ${{ steps.target.outputs.domain }}'
             make ${{ steps.target.outputs.make_prefix }}-smoke
            "

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deployment Summary"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ steps.target.outputs.env_name }} |"
            echo "| Branch | ${{ steps.target.outputs.branch }} |"
            echo "| Revision | ${{ steps.revision.outputs.sha }} |"
            echo "| Domain | ${{ steps.target.outputs.domain }} |"
            echo "| Server folder | ${{ steps.target.outputs.env_dir }} |"
            echo "| Make prefix | ${{ steps.target.outputs.make_prefix }} |"
            echo "| Edge deployed | ${{ steps.target.outputs.deploy_edge }} |"
            echo "| Administrator login | ${{ steps.e2e_admin.outputs.email }} |"
            echo "| Database strategy | ${{ steps.target.outputs.database_strategy }} |"
            echo "| Test release rehearsal | ${{ steps.target.outputs.test_release_rehearsal }} |"
            echo "| Source tree | ${{ steps.revision.outputs.tree_sha }} |"
            echo "| Deployed Playwright | ${{ steps.target.outputs.run_playwright_post_deploy }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deployed-playwright:
    name: Deployed Playwright E2E
    runs-on: ubuntu-latest
    environment: ${{ needs.deploy.outputs.env_name }}
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 30
    needs:
      - deploy

    if: ${{ needs.deploy.outputs.run_playwright_post_deploy == 'true' }}

    env:
      DEPLOYMENT_ENVIRONMENT: ${{ needs.deploy.outputs.env_name }}
      PLAYWRIGHT_BASE_URL: https://${{ needs.deploy.outputs.domain }}
      PLAYWRIGHT_SKIP_WEBSERVER: "true"
      PLAYWRIGHT_AUTH_MODE: session
      PLAYWRIGHT_AUTHZ_ACTOR_ID: e2e-application-admin
      PLAYWRIGHT_AUTHZ_TENANT_ID: default
      E2E_ADMIN_EMAIL: ${{ needs.deploy.outputs.e2e_admin_email }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL_SOURCE: provisioned-by-deploy
      E2E_ADMIN_PASSWORD_CONFIGURED: ${{ secrets.E2E_ADMIN_PASSWORD != '' && 'true' || 'false' }}
      # backend/cmd/provision-e2e-admin creates the deterministic non-Production
      # Tenant Administrator fixtures with the application-admin provisioning
      # password unless E2E_TENANT_ADMIN_PASSWORD explicitly overrides it.
      # Deployed Playwright must authenticate the same fixture credentials.
      E2E_TENANT_ADMIN_EMAIL: tenant-admin@example.com
      E2E_TENANT_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_TENANT_ADMIN_ACTOR_KEY: e2e-default-tenant-admin
      E2E_TENANT_ADMIN_PASSWORD_CONFIGURED: ${{ secrets.E2E_ADMIN_PASSWORD != '' && 'true' || 'false' }}
      TEST_RELEASE_REHEARSAL: ${{ needs.deploy.outputs.test_release_rehearsal }}
      DEPLOYED_TREE_SHA: ${{ needs.deploy.outputs.tree_sha }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy.outputs.revision }}

      - name: Trust checked-out repository
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Show deployed Playwright target
        shell: bash
        run: |
          set -euo pipefail

          echo "DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT}"
          echo "PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL}"
          echo "PLAYWRIGHT_SKIP_WEBSERVER=${PLAYWRIGHT_SKIP_WEBSERVER}"
          echo "PLAYWRIGHT_AUTH_MODE=${PLAYWRIGHT_AUTH_MODE}"
          echo "PLAYWRIGHT_AUTHZ_ACTOR_ID=${PLAYWRIGHT_AUTHZ_ACTOR_ID}"
          echo "E2E_ADMIN_EMAIL_SOURCE=${E2E_ADMIN_EMAIL_SOURCE}"
          echo "E2E_ADMIN_PASSWORD_CONFIGURED=${E2E_ADMIN_PASSWORD_CONFIGURED}"
          echo "E2E_TENANT_ADMIN_EMAIL=${E2E_TENANT_ADMIN_EMAIL}"
          echo "E2E_TENANT_ADMIN_ACTOR_KEY=${E2E_TENANT_ADMIN_ACTOR_KEY}"
          echo "E2E_TENANT_ADMIN_PASSWORD_CONFIGURED=${E2E_TENANT_ADMIN_PASSWORD_CONFIGURED}"
          echo "TEST_RELEASE_REHEARSAL=${TEST_RELEASE_REHEARSAL}"
          echo "DEPLOYED_TREE_SHA=${DEPLOYED_TREE_SHA}"
          if [[ -z "${E2E_ADMIN_EMAIL:-}" || -z "${E2E_ADMIN_PASSWORD:-}" ]]; then
            echo "::error title=Missing deployed Playwright credentials::The deployment did not provide the provisioned administrator login or E2E_ADMIN_PASSWORD is unavailable in the '${DEPLOYMENT_ENVIRONMENT}' GitHub environment."
            exit 1
          fi
          if [[ -z "${E2E_TENANT_ADMIN_EMAIL:-}" || -z "${E2E_TENANT_ADMIN_PASSWORD:-}" || -z "${E2E_TENANT_ADMIN_ACTOR_KEY:-}" ]]; then
            echo "::error title=Missing deployed Tenant Administrator credentials::The deployment did not provide the deterministic Tenant Administrator login, password, and Actor Key required by deployed Tenant-domain Playwright authentication."
            exit 1
          fi
          echo "Deployed Playwright administrator credentials are configured"
          echo "Deployed Playwright Tenant Administrator credentials are configured"
          echo "DEPLOYED_REVISION=${{ needs.deploy.outputs.revision }}"
          echo "CHECKED_OUT_REVISION=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ needs.deploy.outputs.revision }}"

          grep -n "2_500_000" frontend/tests/e2e/earnings-ui.spec.ts
          grep -n "2_500_000" frontend/tests/e2e/planning-edge-cases.spec.ts

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Run Playwright against deployed environment
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          PLAYWRIGHT_AUTH_MODE: session
          PLAYWRIGHT_AUTHZ_TENANT_ID: default
        run: npx playwright test

      - name: Upload deployed Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployed-playwright-report-${{ needs.deploy.outputs.env_name }}
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload deployed Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployed-playwright-test-results-${{ needs.deploy.outputs.env_name }}
          path: frontend/test-results/
          if-no-files-found: ignore

  record-test-release-rehearsal:
    name: Record successful Test release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - deploy
      - deployed-playwright
    if: ${{ needs.deploy.result == 'success' && needs.deployed-playwright.result == 'success' && needs.deploy.outputs.env_name == 'test' && needs.deploy.outputs.test_release_rehearsal == 'true' }}
    environment: test

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts <<'EOF'
          ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Record rehearsal gate
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd '/opt/EnterpriseRemoteSystems/test'
             make server-record-test-release-rehearsal \
               ENV=test \
               TREE_SHA='${{ needs.deploy.outputs.tree_sha }}' \
               REVISION='${{ needs.deploy.outputs.revision }}'
            "

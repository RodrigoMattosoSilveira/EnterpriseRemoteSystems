name: Diagnose ERS SSH credential scope (Test vs Training; read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type COMPARE-ERS-SSH-SCOPES-ONLY (no deployment)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ers-ssh-scope-comparison
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    outputs:
      nonce: ${{ steps.nonce.outputs.nonce }}
    steps:
      - name: Verify explicit read-only request and generate one-time comparison key
        id: nonce
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'COMPARE-ERS-SSH-SCOPES-ONLY' ]] || {
            echo 'BLOCKED: Exact diagnostic confirmation required.' >&2
            exit 2
          }
          python3 - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('nonce=' + secrets.token_hex(32) + '\n')
          print('PASS: One-time private comparison key generated (not printed).')
          PY

  inspect-test:
    needs: prepare
    runs-on: ubuntu-latest
    environment: test
    outputs:
      category: ${{ steps.inspect.outputs.category }}
      comparison_tag: ${{ steps.inspect.outputs.comparison_tag }}
    steps:
      - name: Checkout approved Test source
        uses: actions/checkout@v6
        with:
          ref: test
          persist-credentials: false
      - name: Classify effective Test SSH private key — no network
        id: inspect
        shell: bash
        env:
          ERS_SSH_DIAG_ENVIRONMENT: test
          ERS_SSH_DIAG_SECRET: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ERS_SSH_DIAG_NONCE: ${{ needs.prepare.outputs.nonce }}
        run: |
          set -euo pipefail
          python3 -B scripts/ers-ssh-credential-classify.py

  inspect-training:
    needs: prepare
    runs-on: ubuntu-latest
    environment: training
    outputs:
      category: ${{ steps.inspect.outputs.category }}
      comparison_tag: ${{ steps.inspect.outputs.comparison_tag }}
    steps:
      - name: Checkout approved Test source
        uses: actions/checkout@v6
        with:
          ref: test
          persist-credentials: false
      - name: Classify effective Training SSH private key — no network
        id: inspect
        shell: bash
        env:
          ERS_SSH_DIAG_ENVIRONMENT: training
          ERS_SSH_DIAG_SECRET: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ERS_SSH_DIAG_NONCE: ${{ needs.prepare.outputs.nonce }}
        run: |
          set -euo pipefail
          python3 -B scripts/ers-ssh-credential-classify.py

  compare:
    needs: [inspect-test, inspect-training]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved Test source
        uses: actions/checkout@v6
        with:
          ref: test
          persist-credentials: false
      - name: Compare effective credential bytes and classification — no network
        shell: bash
        env:
          TEST_CATEGORY: ${{ needs.inspect-test.outputs.category }}
          TRAINING_CATEGORY: ${{ needs.inspect-training.outputs.category }}
          TEST_TAG: ${{ needs.inspect-test.outputs.comparison_tag }}
          TRAINING_TAG: ${{ needs.inspect-training.outputs.comparison_tag }}
        run: |
          set -euo pipefail
          python3 -B scripts/ers-ssh-scope-compare.py

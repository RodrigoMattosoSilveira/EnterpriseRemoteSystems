name: CI

on:
  push:
    branches-ignore:
      - development
      - test
      - production

  pull_request:
    branches:
      - development
      - test
      - production

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run backend tests
        run: go test ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run check

      - name: Run frontend unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  playwright:
    name: Playwright local E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 30
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sqlite3 curl python3
          rm -rf /var/lib/apt/lists/*

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:15173
          PLAYWRIGHT_AUTH_MODE: session
          PLAYWRIGHT_AUTHZ_TENANT_ID: default
          PLAYWRIGHT_TENANT_ADMIN_ACTOR_ID: e2e-default-tenant-admin
          PLAYWRIGHT_APPLICATION_ADMIN_ACTOR_ID: e2e-application-admin
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: Local-E2E-Administrator-28D!
          E2E_APPLICATION_ADMIN_ACTOR_KEY: e2e-application-admin
          E2E_TENANT_ADMIN_EMAIL: tenant-admin@example.com
          E2E_TENANT_ADMIN_PASSWORD: Local-E2E-Administrator-28D!
          E2E_TENANT_ADMIN_ACTOR_KEY: e2e-default-tenant-admin
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

name: Deploy ERS Training (TRN) — approved Test candidate

on:
  workflow_dispatch:
    inputs:
      test_revision:
        description: Exact 40-character SHA of latest Test deployment with passed release rehearsal
        required: true
        type: string
      approval_reference:
        description: Training change approval identifier (never a password or token)
        required: true
        type: string
      confirmation:
        description: Type DEPLOY-APPROVED-TEST-TO-TRN
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ers-training-deployment
  cancel-in-progress: false

jobs:
  trn-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A human must start this on the release-candidate branch, not a feature branch.
    if: github.ref_name == 'test'
    environment: training
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      REQUESTED_REVISION: ${{ inputs.test_revision }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Verify explicit request and GitHub Test branch revision
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == DEPLOY-APPROVED-TEST-TO-TRN ]] || { echo 'STOP: explicit deployment confirmation mismatch' >&2; exit 2; }
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'STOP: revision must be exact Git SHA' >&2; exit 2; }
          [[ "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{5,119}$ ]] || { echo 'STOP: approval reference must be an identifier, not arbitrary prose' >&2; exit 2; }
          [[ "${GITHUB_REF_NAME}" == test ]] || exit 2
          echo 'Request format verified; source and deployed Test evidence will be checked separately.'

      - uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0

      - name: Pin exact Test source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$REQUESTED_REVISION" ]] || { echo "STOP: selected revision is not the latest Test branch HEAD ($actual)" >&2; exit 2; }
          tree="$(git rev-parse HEAD^{tree})"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          python3 -B scripts/test-trn-environment.py
          python3 -B scripts/test-trn-stage1-deploy.py

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Validate narrowly scoped 1Password references in runner scratch
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]] || { echo 'STOP: training-only 1Password token is missing' >&2; exit 2; }
          op vault get ers-training >/dev/null
          for forbidden in ers-development ers-test ers-production ers-deployment ers-recovery ers-automation-bootstrap; do
            if op vault get "$forbidden" >/dev/null 2>&1; then
              echo "STOP: training token can read forbidden vault: $forbidden" >&2; exit 2
            fi
          done
          scratch="$(mktemp -d "${RUNNER_TEMP}/ers-training-secrets.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          umask 077
          python3 scripts/ers-op-materialize.py \
            --template ops/1password/training.env.tpl \
            --output "$scratch/training.env" --expected-root "$scratch"
          # The Training fragment validator requires an independent AWS
          # credentials fragment. Read both only into runner scratch; never
          # upload either fragment or include its values in the logs.
          python3 scripts/ers-op-materialize.py \
            --template ops/1password/training-aws-credentials.tpl \
            --output "$scratch/aws-credentials" --expected-root "$scratch"
          python3 scripts/ers-op-validate-fragments.py \
            --environment training --fragment "$scratch/training.env" \
            --aws-credentials "$scratch/aws-credentials"
          echo 'Training 1Password references verified; no secrets transferred or logged.'

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ -s ~/.ssh/id_ed25519 && -s ~/.ssh/known_hosts ]] || { echo 'STOP: training SSH configuration missing' >&2; exit 2; }

      - name: Retrieve actual TST rehearsal marker (read only)
        shell: bash
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/test-release-rehearsal.passed"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat '/opt/EnterpriseRemoteSystems/test/release-rehearsal-passed/${{ steps.source.outputs.tree }}.passed'" > "$marker"
          python3 -B scripts/ers-trn-preflight.py verify-test \
            --marker "$marker" --revision "$REQUESTED_REVISION" \
            --tree-sha '${{ steps.source.outputs.tree }}'

      - name: Read-only shared Hetzner capacity and TRN directory preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd /opt/EnterpriseRemoteSystems/test; python3 -B scripts/ers-trn-preflight.py check-host --server-root /opt/EnterpriseRemoteSystems; test -d /opt/EnterpriseRemoteSystems/training; test -f /opt/EnterpriseRemoteSystems/training/.env.training; test -d /opt/EnterpriseRemoteSystems/training/.git; cd /opt/EnterpriseRemoteSystems/training; git diff --quiet; git diff --cached --quiet; make server-environment-contract-check ENV=training"

      - name: Deploy pinned TST-approved revision using standard SSH command execution
        shell: bash
        run: |
          set -euo pipefail
          # The existing DEV/TST/PRD workflow executes an SSH command, not a
          # streamed shell program. -n also makes remote Docker invocations
          # unable to consume the runner's deployment program as stdin.
          deployment_log="$(mktemp "${RUNNER_TEMP}/trn-deployment.XXXXXXXX.log")"
          trap 'rm -f -- "$deployment_log"' EXIT
          ssh -n -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -euo pipefail -c 'cd /opt/EnterpriseRemoteSystems/training &&
              git diff --quiet && git diff --cached --quiet &&
              git fetch origin test &&
              test \$(git rev-parse FETCH_HEAD) = $REQUESTED_REVISION &&
              git checkout --detach $REQUESTED_REVISION &&
              test \$(git rev-parse HEAD) = $REQUESTED_REVISION &&
              test \$(git rev-parse HEAD^{tree}) = ${{ steps.source.outputs.tree }} &&
              exec bash scripts/ers-trn-deploy-remote.sh $REQUESTED_REVISION ${{ steps.source.outputs.tree }}'" \
            2>&1 | tee "$deployment_log"
          # Remote exit status alone is insufficient: require the final marker
          # emitted ONLY after internal health, gate commit and off-host backup.
          grep -Fxq \
            "PASS: TRN DEPLOYMENT VERIFIED revision=$REQUESTED_REVISION tree=${{ steps.source.outputs.tree }}" \
            "$deployment_log" || {
              echo 'STOP: Training remote deployment did not reach its final verified state' >&2
              exit 2
            }

      - name: Record release selection without claiming human acceptance
        shell: bash
        run: |
          echo "## Training deployment candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Test SHA: $REQUESTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Test tree: ${{ steps.source.outputs.tree }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Approval reference: $APPROVAL_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified TRN application startup, committed migration state, internal health and off-host backup. Public HTTPS, independent isolated backup restoration, trainee sign-in and human approval remain manual acceptance.' >> "$GITHUB_STEP_SUMMARY"

APIError:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
    message:
      type: string
    fields:
      type: object
      additionalProperties:
        type: string
    fieldCodes:
      type: object
      description: >-
        Optional stable, locale-independent rule code per field (for example
        `required` or `must_be_positive`). Clients translate these codes; the
        English text in `fields` is kept for compatibility and diagnostics.
      additionalProperties:
        type: string

ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      $ref: "#/APIError"